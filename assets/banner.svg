<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="accent-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .pulse-circle {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .float-box {
        animation: float 6s ease-in-out infinite alternate;
      }
      .scan-line {
        animation: scan 5s linear infinite;
      }
      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.3; }
        100% { transform: scale(1.15); opacity: 0.7; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-12px); }
      }
      @keyframes scan {
        0% { transform: translateY(0px); opacity: 0; }
        50% { opacity: 0.8; }
        100% { transform: translateY(220px); opacity: 0; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-grad)"/>

  <!-- Dynamic / Animated Background Visual Elements (Behind text) -->
  <g opacity="0.25">
    <!-- Grid -->
    <path d="M0,50 H1200 M0,100 H1200 M0,150 H1200 M0,200 H1200 M0,250 H1200" stroke="#38bdf8" stroke-width="0.5" stroke-dasharray="4,4"/>
    <path d="M100,0 V300 M200,0 V300 M300,0 V300 M400,0 V300 M500,0 V300 M600,0 V300 M700,0 V300 M800,0 V300 M900,0 V300 M1000,0 V300 M1100,0 V300" stroke="#38bdf8" stroke-width="0.5" stroke-dasharray="4,4"/>
    
    <!-- Glowing Pulsing Orbs -->
    <circle cx="150" cy="80" r="70" fill="#0284c7" filter="url(#glow)" class="pulse-circle"/>
    <circle cx="1050" cy="220" r="90" fill="#7e22ce" filter="url(#glow)" class="pulse-circle" style="animation-delay: -2s;"/>

    <!-- Decorative Floating Container Nodes -->
    <g class="float-box">
      <rect x="80" y="170" width="90" height="60" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="125" y="205" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">📦 Docker</text>
    </g>
    <g class="float-box" style="animation-delay: -3s;">
      <rect x="1020" y="60" width="100" height="60" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
      <text x="1070" y="95" fill="#818cf8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">☸️ K8s</text>
    </g>

    <!-- Animated Scan Line -->
    <line x1="0" y1="40" x2="1200" y2="40" stroke="#00f2fe" stroke-width="2" class="scan-line" filter="url(#glow)"/>
  </g>

  <!-- Title and Subtitle Foreground (High Contrast & Clear visibility) -->
  <g text-anchor="middle">
    <!-- Main Title -->
    <text x="600" y="125" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="44" fill="url(#text-grad)" letter-spacing="1">
      Awesome Container Security Platform
    </text>
    
    <!-- Tagline / Subtitle -->
    <text x="600" y="175" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="18" fill="#94a3b8" letter-spacing="0.5">
      🛡️ Curated SaaS &amp; Open-Source Ecosystem for Container &amp; Kubernetes Security
    </text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(310, 205)">
      <rect x="0" y="0" width="130" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="65" y="19" font-family="sans-serif" font-size="12" fill="#38bdf8" font-weight="600">🔍 Image Scan</text>

      <rect x="145" y="0" width="140" height="30" rx="15" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
      <text x="215" y="19" font-family="sans-serif" font-size="12" fill="#818cf8" font-weight="600">⚡ Runtime Guard</text>

      <rect x="300" y="0" width="130" height="30" rx="15" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
      <text x="365" y="19" font-family="sans-serif" font-size="12" fill="#c084fc" font-weight="600">📄 SBOM &amp; Supply</text>

      <rect x="445" y="0" width="135" height="30" rx="15" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
      <text x="512" y="19" font-family="sans-serif" font-size="12" fill="#34d399" font-weight="600">☸️ K8s Posture</text>
    </g>
  </g>
</svg>
